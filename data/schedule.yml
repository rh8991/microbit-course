# ============================================================
#  סדר המפגשים – זה הקובץ שעורכים!
# ============================================================
#  איך עורכים:
#  - כל מפגש מתחיל ב-  "- num:"
#  - lessons: רשימת מזהי השיעורים (id) מתוך הקובץ lessons.yml
#  - כדי להחליף שיעור: מחליפים את המזהה ברשימה.
#  - שיעור שלא מופיע באף מפגש עובר אוטומטית ל"מאגר שיעורים נוסף" בדף המדריך.
#  - part: microbit (חלק א׳) או tinybit (חלק ב׳)
#  - student_note / guide_note – משפט קצר (לא חובה) שיופיע על כרטיס המפגש.
#  - שימו לב לרווחים בתחילת השורה – הם חשובים!
# ============================================================

parts:
  - id: microbit
    title: "חלק א׳ – מכירים את המיקרוביט (מפגשים 1–16)"
    description: "לומדים לתכנת את לוח המיקרוביט: תצוגה, כפתורים, חיישנים, צלילים ורדיו."
  - id: tinybit
    title: "חלק ב׳ – הרובוט Tiny:bit (מפגשים 17–28)"
    description: "מחברים את המיקרוביט לרובוט ומלמדים אותו להאיר, לנגן, לנסוע ולהרגיש את העולם."

sessions:
  # ---------- חלק א׳: micro:bit ----------
  - num: 1
    part: microbit
    title: "נעים להכיר, מיקרוביט!"
    lessons: [meet-your-microbit, heart]

  - num: 2
    part: microbit
    title: "אנימציה ולולאה לעולם"
    lessons: [beating-heart, animated-animals]

  - num: 3
    part: microbit
    title: "כפתורים ואירועים"
    lessons: [emotion-badge, flashing-emotions]

  - num: 4
    part: microbit
    title: "טקסט ותמונות"
    lessons: [name-badge, here-comes-the-sun]

  - num: 5
    part: microbit
    title: "מטלטלים ומגרילים"
    lessons: [dice, graphical-dice]

  - num: 6
    part: microbit
    title: "תנאים – אם... אז..."
    lessons: [rock-paper-scissors, magic-8ball]

  - num: 7
    part: microbit
    title: "משתנים – הזיכרון של המחשב"
    lessons: [counter, step-counter]

  - num: 8
    part: microbit
    title: "חיישן האור"
    lessons: [nightlight, sunlight-sensor]

  - num: 9
    part: microbit
    title: "טמפרטורה ומצפן"
    lessons: [thermometer, compass-bearing]

  - num: 10
    part: microbit
    title: "מוזיקה וצלילים"
    lessons: [jukebox, make-some-noise]

  - num: 11
    part: microbit
    title: "המיקרופון"
    lessons: [sound-meter, clap-hearts]
    guide_note: "דורש micro:bit V2"

  - num: 12
    part: microbit
    title: "רדיו – מדברים בין לוחות"
    lessons: [teleporting-duck, send-a-smile]

  - num: 13
    part: microbit
    title: "אזעקות חכמות"
    lessons: [simple-tilt-alarm, cookie-tin-alarm]

  - num: 14
    part: microbit
    title: "משחקים"
    lessons: [hot-potato-game, times-tables-tester]

  - num: 15
    part: microbit
    title: "פרויקט גדול"
    lessons: [microbit-pet, treasure-hunt]

  - num: 16
    part: microbit
    title: "פרויקט סיכום – חלק א׳"
    lessons: [project-part-a]

  # ---------- חלק ב׳: Tiny:bit ----------
  - num: 17
    part: tinybit
    title: "פוגשים את הרובוט"
    lessons: [tb-first-trial]

  - num: 18
    part: tinybit
    title: "אורות הרובוט"
    lessons: [tb-led-light, tb-breathing-light]

  - num: 19
    part: tinybit
    title: "פנסים צבעוניים"
    lessons: [tb-rgb-searching-light, tb-rgb-exchange]

  - num: 20
    part: tinybit
    title: "הרובוט שר"
    lessons: [tb-internal-music, tb-merry-christmas]

  - num: 21
    part: tinybit
    title: "הרובוט נוסע!"
    lessons: [tb-advance, tb-carrun]

  - num: 22
    part: tinybit
    title: "מהירות וריקוד"
    lessons: [tb-control-speed, tb-dancer]

  - num: 23
    part: tinybit
    title: "מתכננים מסלול"
    lessons: [tb-route-plan]

  - num: 24
    part: tinybit
    title: "חיישן המרחק"
    lessons: [tb-measuring-worker, tb-distance-light]

  - num: 25
    part: tinybit
    title: "נזהרים ממכשולים"
    lessons: [tb-obstacle-avoidance, tb-coward]

  - num: 26
    part: tinybit
    title: "נוסעים על קו"
    lessons: [tb-tracking]

  - num: 27
    part: tinybit
    title: "שלט וקול"
    lessons: [tb-ir-control, tb-voice-control-light]

  - num: 28
    part: tinybit
    title: "פרויקט גמר ותערוכה"
    lessons: [project-final]
