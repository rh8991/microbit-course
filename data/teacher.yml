#                 המערך יוצג גם בדף השיעור (תצוגת מדריך) של כל אחד מהם.
#    goals, flow, materials, notes – רשימות
#    links      – קישורים נוספים: { title, url }
#    files      – קבצים מוכנים (hex וכו׳): { title, url }
#
#  useful_links – קישורים שימושיים כלליים: { title, url, note }
# ============================================================

