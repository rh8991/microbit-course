# ============================================================
#  חומרי מדריך – מערכי שיעור טכנודע וקישורים שימושיים
# ============================================================
#  המקור: המסמך "קישורים שימושיים רובוטיקה מחצית ראשונה" (microbit.pdf)
#  והתיקיות ב-Google Drive שמקושרות ממנו.
#
#  plans – מערכי השיעור (מופיעים בלשונית "מערכי שיעור" בדף המדריך)
