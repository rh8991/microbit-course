plans:
  - num: 1
    title: "היכרות עם תחום הרובוטיקה והמעגל החשמלי"
    folder: "https://drive.google.com/drive/folders/1OsbTjT4-yaMm48n1DNZrDp3aDghR-xW6?usp=drive_link"
    doc: "https://drive.google.com/file/d/1mjRWDh6wWfqg0a0Xdsp8gznYE0tKtKeP/view"
    lessons: [meet-your-microbit]
    summary: "מכירים את תחום הרובוטיקה ואת הבקר, מודדים מתח בסוללות ובונים מעגלים בטור ובמקביל."
    goals:
      - "היכרות עם הבקר micro:bit ויכולותיו הבסיסיות"
      - "מושגי יסוד בחשמל: מתח (וולט), קטבים, מעגל פתוח/סגור, טור ומקביל, מפסק"
      - "מדידת מתח בסוללות שונות ברב-מודד"
      - "הבנה בסיסית של מבנה הסוללה"
    flow:
      - "10 ד׳ – פתיחה: מטרות הקורס, מה זו רובוטיקה, הצגת המיקרוביט (תצוגת לדים, ג׳ירוסקופ, רמקול) ואתר microbit.org"
      - "15 ד׳ – מדידת מתח בסוללות 1.5V, 3V, 9V ברב-מודד; קטבים חיובי ושלילי"
      - "15 ד׳ – בניית מעגל חשמלי בטור: סוללה, נורת לד וחוטים; מעגל פתוח/סגור"
      - "20 ד׳ – מעגלים בטור ובמקביל עם מטריצה ומפסק; ההבדל בבהירות"
    materials: ["חוטי חשמל", "נורות לד", "כבלים זכר-זכר / זכר-נקבה", "סוללות 1.5V, 3V, 9V", "מפסקים", "מטריצות", "רב-מודדים", "איזולירבנד", "micro:bit + כבל USB"]
    notes:
      - "לוודא שכל תלמיד מבחין בין חיבור נכון לשגוי"
      - "להקפיד על בטיחות בעבודה עם סוללות ומד מתח"
      - "להשאיר זמן לשאלות והתלהבות – זה המפגש הראשון!"
    links:
      - { title: "סימולטור מעגל חשמלי (PhET)", url: "https://phet.colorado.edu/sims/html/circuit-construction-kit-dc/latest/circuit-construction-kit-dc_iw.html" }
      - { title: "אתר micro:bit", url: "https://microbit.org/" }

