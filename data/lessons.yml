  - id: tb-route-plan
    title: "מתכננים מסלול"
    source: tinybit
    level: intermediate
    concepts: [אלגוריתם, תכנון]
    summary: "מתכנתים את הרובוט לנסוע במסלול מוגדר – ריבוע, משולש, מבוך."
    student:
      goal: "נתכנת את הרובוט לנסוע במסלול שבחרנו מראש – ריבוע, משולש, או לצאת ממבוך!"
      concept: "**אלגוריתם** הוא רשימת הוראות מסודרת שמובילה למטרה. גם מתכון של עוגה הוא אלגוריתם!"
      steps:
        - "ציירו את המסלול על דף. כמה צעדים? כמה סיבובים?"
        - "גלו בניסוי: כמה מילישניות של [[CarCtrl SpinRight]] יוצרות סיבוב של 90 מעלות?"
        - "ריבוע: [[חזור 4 פעמים]] ← קדימה 1 שנייה, סיבוב 90°."
        - "בדקו, תקנו, ובדקו שוב."
      tip: "תיקון מספרים אחרי בדיקה הוא חלק רגיל מהעבודה של מהנדסים. לא מתייאשים!"
      challenge: "סמנו מבוך על הרצפה בסרט הדבקה ותכנתו את הרובוט לצאת ממנו."
    guide:
      duration: "90 דקות"
      objectives: ["אלגוריתם", "כיול בניסוי וטעייה", "חזור"]
      materials: ["Tiny:bit + micro:bit", "סרט הדבקה צבעוני לסימון מסלולים"]
      prep: "לסמן מבוכים פשוטים על הרצפה לפני השיעור."
      common_mistakes: ["כיול על משטח אחד ובדיקה על משטח אחר", "סוללה נחלשת משנה את זמני הסיבוב"]
    links:
      source: "https://github.com/YahboomTechnology/Tiny-bit/tree/master/05.Running%20with%20Tiny%20bit/5.Route%20plan"
      makecode: "https://makecode.microbit.org/"

  - id: tb-measuring-worker
    title: "מודד המרחקים"
    source: tinybit
    level: beginner
    concepts: [חיישן מרחק]
    summary: "הרובוט מודד מרחק בסנטימטרים ומציג על המסך."
    student:
      goal: "נשתמש ב'עיניים' של הרובוט כדי למדוד מרחקים."
      concept: "**חיישן אולטרסוני** שולח צליל גבוה שאנחנו לא שומעים, ומחכה להד. כמו עטלף! לפי הזמן שלוקח להד לחזור, הוא יודע מה המרחק."
      steps:
        - "בתוך [[לעולמים]]: [[הצג מספר]]."
        - "לתוכו: [[ultrasonic return distance(cm)]] (או [[ultrasonic for V2]] אם יש לכם micro:bit V2)."
        - "העבירו לרובוט והזיזו את היד מול החיישן."
        - "מדדו בסרגל ובדקו אם החיישן צודק."
      tip: "בדקו איזה לוח יש לכם: ב-V2 כתוב V2 בגב הלוח. בוחרים את הבלוק המתאים."
      challenge: "מדדו את הרוחב של הכיתה בעזרת הרובוט."
    guide:
      duration: "45 דקות"
      objectives: ["חיישן אולטרסוני", "השוואה למדידה ידנית"]
      materials: ["Tiny:bit + micro:bit", "סרגל / סרט מדידה"]
      common_mistakes: ["שימוש בבלוק V1 עם לוח V2 – מתקבל 0 או מספרים מוזרים"]
    images:
      - "https://raw.githubusercontent.com/YahboomTechnology/Tiny-bit/master/06.Playing%20with%20Tiny%20bit/1.Measuring%20worker/Measuring%20worker.png"
    links:
      source: "https://github.com/YahboomTechnology/Tiny-bit/tree/master/06.Playing%20with%20Tiny%20bit/1.Measuring%20worker"
      makecode: "https://makecode.microbit.org/"

  - id: tb-distance-light
    title: "אור לפי מרחק"
    source: tinybit
    level: intermediate
    concepts: [חיישן מרחק, תנאי]
    summary: "הפנס משנה צבע לפי המרחק מהמכשול."
    student:
      goal: "נבנה רמזור: רחוק = ירוק, באמצע = צהוב, קרוב = אדום 🚦."
      steps:
        - "צרו משתנה distance, ובתוך [[לעולמים]] שמרו בו את המרחק מהחיישן."
        - "[[אם]] distance < 10 → [[RGB_Car_Big value Red]]."
        - "[[אחרת אם]] distance < 20 → Yellow."
        - "[[אחרת]] → Green."
      tip: "שמירת המרחק במשתנה חוסכת קריאה כפולה של החיישן."
      challenge: "הוסיפו צפצוף כשהמכשול קרוב מאוד – כמו חיישן חנייה של מכונית."
    guide:
      duration: "45 דקות"
      objectives: ["אם / אחרת אם עם טווחים", "שימוש במשתנה לשמירת קריאה"]
      materials: ["Tiny:bit + micro:bit"]
      extension: "חיישן חנייה: צפצוף שמאיץ ככל שמתקרבים."
    links:
      source: "https://github.com/YahboomTechnology/Tiny-bit/tree/master/06.Playing%20with%20Tiny%20bit/2.Distance%20control%20light"
      makecode: "https://makecode.microbit.org/"

  - id: tb-obstacle-avoidance
    title: "נמנעים ממכשולים"
    source: tinybit
    level: intermediate
    concepts: [חיישן מרחק, תנאי, רובוט אוטונומי]
    summary: "הרובוט נוסע לבד ומסתובב כשמשהו מולו."
    student:
      goal: "נבנה רובוט שנוסע לבד ולא נתקע בקירות! זה **רובוט אוטונומי** – הוא מחליט לבד."
      steps:
        - "בתוך [[לעולמים]]: [[אם]] המרחק < 15."
        - "אם כן → [[CarCtrlSpeed SpinLeft speed 80]] ו-[[השהה (ms) 300]]."
        - "[[אחרת]] → [[CarCtrlSpeed Run speed 80]]."
        - "בנו מסלול מכשולים מקופסאות ושחררו את הרובוט."
      tip: "החיישן לא תמיד רואה דברים רכים (בד) או דקים (רגל של כיסא)."
      challenge: "הוסיפו אורות: אדום כשמסתובב, ירוק כשנוסע."
    guide:
      duration: "50 דקות"
      objectives: ["חישה ← החלטה ← פעולה", "רובוט אוטונומי"]
      materials: ["Tiny:bit + micro:bit", "קופסאות קרטון למכשולים"]
      common_mistakes: ["מהירות גבוהה מדי – הרובוט לא מספיק לעצור"]
    images:
      - "https://raw.githubusercontent.com/YahboomTechnology/Tiny-bit/master/06.Playing%20with%20Tiny%20bit/3.Ultrasonic%20obstacle%20avoidance/Ultrasonic-avoid.png"
    links:
      source: "https://github.com/YahboomTechnology/Tiny-bit/tree/master/06.Playing%20with%20Tiny%20bit/3.Ultrasonic%20obstacle%20avoidance"
      makecode: "https://makecode.microbit.org/"

  - id: tb-coward
    title: "הרובוט הפחדן"
    source: tinybit
    level: intermediate
    concepts: [חיישן מרחק, תנאי]
    summary: "מתקרבים לרובוט – והוא בורח אחורה."
    student:
      goal: "נבנה רובוט פחדן 😱 שבורח אחורה כשמישהו מתקרב אליו."
      steps:
        - "בתוך [[לעולמים]]: [[אם]] המרחק < 15."
        - "אם כן → [[CarCtrl Back]], פרצוף מפוחד ופנס אדום."
        - "[[אחרת]] → [[CarCtrl Stop]] ופרצוף רגוע."
        - "קרבו את היד לרובוט לאט."
      tip: "זה כמעט אותו קוד כמו הימנעות ממכשולים – רק התגובה שונה."
      challenge: "צרו את ההפך: רובוט אמיץ שעוקב אחרי היד (מתקרב אם המרחק בין 15 ל-30)."
    guide:
      duration: "40 דקות"
      objectives: ["אותו חיישן – התנהגויות שונות"]
      materials: ["Tiny:bit + micro:bit"]
      extension: "Magic hand מהמאגר – הרובוט עוקב אחרי היד."
    images:
      - "https://raw.githubusercontent.com/YahboomTechnology/Tiny-bit/master/06.Playing%20with%20Tiny%20bit/9.Coward/Coward.png"
    links:
