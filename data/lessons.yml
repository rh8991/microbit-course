  - id: tb-first-trial
    title: "פוגשים את Tiny:bit"
    source: tinybit
    level: beginner
    concepts: [הרכבה, תוסף]
    summary: "מכירים את הרובוט, מכניסים את המיקרוביט ומוסיפים את התוסף ל-MakeCode."
    student:
      intro: "Tiny:bit הוא רובוט קטן על גלגלים. המיקרוביט הוא המוח שלו, והרובוט נותן לו גוף: מנועים, אורות, צופר וחיישנים."
      goal: "נכיר את חלקי הרובוט ונכין את MakeCode לעבוד איתו."
      concept: "**תוסף** (Extension) מוסיף ל-MakeCode בלוקים חדשים. התוסף של Tiny:bit מוסיף בלוקים ירוקים שמזיזים את הרובוט."
      steps:
        - "מצאו על הרובוט: 2 מנועים וגלגלים, פנס צבעוני גדול מקדימה, נורות צבעוניות מתחת, חיישן מרחק (עיניים), 2 חיישני קו מתחת, מיקרופון וזמזם."
        - "הכניסו את המיקרוביט לחריץ – **המסך פונה קדימה**."
        - "ב-MakeCode פתחו פרויקט חדש ← **הרחבות** ← הדביקו את הכתובת: [[https://github.com/YahboomTechnology/Tiny-bitLib]]"
        - "מופיעה קטגוריה חדשה בשם **Tinybit**. הציצו בבלוקים."
        - "נסו: בתוך [[כאשר מתחיל]] שימו [[RGB_Car_Big value Red]] והעבירו ללוח. הפנס האדום דולק?"
      tip: "מכבים את הרובוט במתג כשלא משתמשים בו, כדי לחסוך בסוללה."
      challenge: "בדקו את כל הצבעים שהפנס יודע להציג."
    guide:
      duration: "90 דקות"
      objectives: ["היכרות עם הרובוט", "הוספת תוסף", "כללי בטיחות ושמירה על הציוד"]
      materials: ["ערכת Tiny:bit לכל זוג (טעונה!)", "micro:bit", "כבל USB"]
      prep: "לטעון את כל הרובוטים מהיום הקודם. כדאי לשמור פרויקט התחלתי שכבר כולל את התוסף ולשתף קישור – זה חוסך זמן בכל שיעור."
      flow:
        - "15 ד׳ – הצגת הרובוט וכללי עבודה (רובוט על השולחן = עלול ליפול!)"
        - "20 ד׳ – סיור בחלקים"
        - "25 ד׳ – הוספת התוסף ותוכנית ראשונה"
        - "30 ד׳ – חקירה חופשית של הבלוקים"
      common_mistakes: ["מיקרוביט מוכנס הפוך", "מתג כבוי", "סוללה ריקה"]
      extension: "הקובץ First Trial.pdf בתיקיית המקור – בדיקת הרובוט מהטלפון דרך בלוטות׳."
    links:
      source: "https://github.com/YahboomTechnology/Tiny-bit/tree/master/01.First%20Trial"
      makecode: "https://makecode.microbit.org/"

  - id: tb-led-light
