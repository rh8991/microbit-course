# ============================================================
#  מאגר השיעורים
# ============================================================
#  כל שיעור מתחיל ב-  "- id:"   (המזהה משמש בקובץ schedule.yml)
#  שדות:
#    title      – שם השיעור
#    source     – microbit / tinybit / project
#    level      – beginner / intermediate / advanced
#    needs_v2   – true אם צריך micro:bit V2 (רמקול/מיקרופון/לוגו מגע)
#    summary    – משפט אחד (מופיע במאגר)
#    student    – intro, goal, concept, steps (רשימה), tip, challenge
#    guide      – duration, objectives, materials, prep, flow, common_mistakes, extension
#    images     – תמונות קוד (קישורים)
#    links      – source (השיעור המקורי), makecode (קישור כללי)
#                 code – רשימת תוכניות: label (רשות, כשיש כמה), makecode (#pub), hex
#  עיצוב בתוך טקסט:  **מודגש**   ו-  [[שם בלוק]]
#  שיעור שלא משובץ ב-schedule.yml מופיע אוטומטית במאגר השיעורים הנוסף.
# ============================================================

lessons:

# ============================================================
#  חלק א׳ – micro:bit  (שיעורים משובצים)
# ============================================================

  - id: meet-your-microbit
    title: "נעים להכיר – המיקרוביט"
    source: microbit
    level: beginner
    concepts: [חומרה, קלט, פלט]
    summary: "סיור בלוח: נורות, כפתורים, חיישנים, ואיך מעבירים אליו תוכנה."
    student:
      intro: "המיקרוביט הוא מחשב קטנטן בגודל של כרטיס. יש לו 25 נורות, כפתורים, וחיישנים שמרגישים אור, תנועה וטמפרטורה."
      goal: "נכיר את החלקים של הלוח ונכתוב את התוכנית הראשונה שלנו."
      concept: "**קלט** זה מה שהמחשב מקבל (לחיצה על כפתור, תנועה). **פלט** זה מה שהמחשב עושה (מדליק נורות, משמיע צליל)."
      steps:
        - "הסתכלו על הלוח ומצאו: 25 הנורות (LED), כפתור A, כפתור B, ושקע ה-USB."
        - "הפכו את הלוח. מצאו את המעבד ואת החיישנים – כתוב עליהם באנגלית."
        - "פתחו את MakeCode בכתובת makecode.microbit.org ולחצו על **פרויקט חדש**."
        - "גררו את הבלוק [[הצג מחרוזת]] לתוך [[כאשר מתחיל]] וכתבו בו את השם שלכם."
        - "בדקו בסימולטור (המיקרוביט שעל המסך) שהשם זז."
        - "חברו את הלוח בכבל USB, לחצו **הורדה** ושמרו את הקובץ על הכונן MICROBIT."
      tip: "הכפתורים באתר פותחים את MakeCode בעברית, ושמות הבלוקים בדפים שלנו כתובים כמו שהם מופיעים שם. אם MakeCode נפתח באנגלית: גלגל השיניים ⚙️ ← Language ← עברית."
      challenge: "גרמו לשם שלכם להופיע, ואחריו סמיילי 🙂."
    guide:
      duration: "45 דקות"
      objectives:
        - "היכרות עם רכיבי הלוח: קלט ופלט"
        - "היכרות עם סביבת MakeCode והסימולטור"
        - "העברת תוכנית ללוח (Download / WebUSB)"
      materials: ["micro:bit + כבל USB לכל זוג", "מחשבים עם דפדפן Chrome/Edge"]
      prep: "לבדוק מראש שהמחשבים מזהים את הלוח כ-MICROBIT. ב-Chrome אפשר לבצע Pair לחיבור ישיר (WebUSB) ולחסוך גרירת קבצים."
      flow:
        - "5 ד׳ – מה זה מחשב? איפה יש מחשבים קטנים סביבנו?"
        - "10 ד׳ – סיור בלוח בזוגות, לפי דף העבודה"
        - "20 ד׳ – תוכנית ראשונה בסימולטור והעברה ללוח"
        - "10 ד׳ – הצגה ושיתוף"
      common_mistakes:
        - "שמירת הקובץ בתיקיית ההורדות במקום על הכונן MICROBIT"
        - "כבל USB שמיועד לטעינה בלבד ולא מעביר נתונים"
      extension: "לגלות מה עושה כפתור ה-Reset בגב הלוח."
    links:
      source: "https://microbit.org/projects/make-it-code-it/meet-your-microbit/"
      code:
        - makecode: "https://makecode.microbit.org/#pub:_95o2F2hd3eJp"
          hex: "https://downloads.microbit.org/downloads/meet-your-micro-bit-makecode.hex"

  - id: heart
    title: "לב"
    source: microbit
    level: beginner
    concepts: [פלט, תצוגה]
    summary: "מציגים אייקון לב על מסך הנורות."
    student:
      goal: "נגרום ללב להופיע על מסך הנורות של המיקרוביט."
      concept: "**אייקון** הוא ציור מוכן מראש שהמיקרוביט יודע להציג."
      steps:
        - "בקטגוריה **בסיס** מצאו את הבלוק [[הצג את הסמל]]."
        - "גררו אותו לתוך [[כאשר מתחיל]]."
        - "בחרו בתפריט את ציור הלב ❤️."
        - "בדקו בסימולטור והעבירו ללוח."
      tip: "הבלוק [[כאשר מתחיל]] רץ פעם אחת בלבד – כשהלוח נדלק."
      challenge: "השתמשו בבלוק [[הצג נוריות לד]] וציירו לב משלכם – אולי לב קטן או לב שבור?"
    guide:
      duration: "30 דקות"
      objectives: ["שימוש בבלוק תצוגה", "הבנת [[כאשר מתחיל]]"]
      materials: ["micro:bit + כבל USB", "סוללות (לא חובה)"]
      flow:
        - "הדגמה קצרה על המקרן"
        - "עבודה עצמית"
        - "חיבור סוללה – הלב נשאר גם בלי מחשב!"
      common_mistakes: ["בלוק שנשאר מחוץ לבלוק [[כאשר מתחיל]] (מופיע אפור ולא רץ)"]
      extension: "לצייר 3 אייקונים שונים בזה אחר זה עם הצג נוריות לד."
    links:
      source: "https://microbit.org/projects/make-it-code-it/heart/"
      code:
        - makecode: "https://makecode.microbit.org/#pub:_1M2V0eiFb7jJ"
          hex: "https://downloads.microbit.org/downloads/heart-hearts-makecode.hex"

  - id: beating-heart
    title: "לב פועם"
    source: microbit
    level: beginner
    concepts: [לולאה, אנימציה]
    summary: "לב גדול ולב קטן מתחלפים בלולאה ויוצרים לב פועם."
    student:
      goal: "נגרום ללב לפעום – גדול, קטן, גדול, קטן... בלי להפסיק."
      concept: "**לולאה** (לעולמים) חוזרת על הפקודות שוב ושוב, לנצח. כשתמונות מתחלפות מהר נוצרת **אנימציה**."
      steps:
        - "גררו לתוך [[לעולמים]] את הבלוק [[הצג את הסמל]] ובחרו לב גדול."
        - "הוסיפו מתחתיו עוד [[הצג את הסמל]] ובחרו לב קטן."
        - "צפו בסימולטור – הלב פועם!"
        - "העבירו ללוח."
      tip: "רוצים פעימה מהירה או איטית? הוסיפו [[השהה (ms)]] בין הלבבות. 1000 מילישניות = שנייה אחת."
      challenge: "גרמו ללב לפעום כמו לב של מישהו שרץ – מהר מאוד!"
    guide:
      duration: "45 דקות"
      objectives: ["הבנת לולאה אינסופית", "תזמון עם [[השהה (ms)]]"]
      materials: ["micro:bit + כבל USB"]
      flow:
        - "שאלה: איך עושים סרט מצויר? (הרבה תמונות מהר)"
        - "בניית הלב הפועם"
        - "ניסוי: מה קורה כשמשנים את זמן ההשהיה?"
      common_mistakes: ["הכנסת הבלוקים ל-[[כאשר מתחיל]] ולא ל-[[לעולמים]] – הלב פועם פעם אחת בלבד"]
      extension: "למדוד דופק אמיתי בדקה ולהתאים את מהירות הפעימה."
    links:
      source: "https://microbit.org/projects/make-it-code-it/beating-heart/"
      code:
        - makecode: "https://makecode.microbit.org/#pub:_AUiYbFHgp6wK"
          hex: "https://downloads.microbit.org/downloads/beating-heart-makecode.hex"

  - id: animated-animals
    title: "חיות מונפשות"
    source: microbit
    level: beginner
    concepts: [אנימציה, לולאה]
    summary: "מציירים חיה בכמה תמונות ויוצרים אנימציה."
    student:
      goal: "נצייר חיה שזזה – למשל ברווז שפותח מקור או ארנב שמזיז אוזניים."
      steps:
        - "בחרו חיה. חשבו מה בה זז."
        - "בתוך [[לעולמים]] שימו שני בלוקים [[הצג נוריות לד]]."
        - "בראשון ציירו את החיה, ובשני את אותה חיה עם שינוי קטן."
        - "הוסיפו [[השהה (ms)]] כדי לשלוט במהירות."
      tip: "השינוי בין התמונות צריך להיות קטן – ככה התנועה נראית חלקה."
      challenge: "הוסיפו תמונה שלישית ורביעית – אנימציה ארוכה יותר!"
    guide:
      duration: "45 דקות"
      objectives: ["תכנון אנימציה במסגרות (frames)"]
      materials: ["micro:bit", "דף משבצות 5×5 לתכנון על נייר"]
      prep: "להדפיס דפי משבצות 5×5."
      flow: ["תכנון על נייר", "מימוש בקוד", "תערוכת חיות"]
      extension: "חיה שמשנה כיוון כשלוחצים על כפתור."
    links:
      source: "https://microbit.org/projects/make-it-code-it/animated-animals/"
      code:
        - makecode: "https://makecode.microbit.org/#pub:_J9rK89hgJJRV"
          hex: "https://downloads.microbit.org/downloads/animated-animals-makecode.hex"

  - id: emotion-badge
    title: "תג רגשות"
    source: microbit
    level: beginner
    concepts: [אירועים, קלט, כפתורים]
    summary: "לחיצה על A מציגה פרצוף שמח, לחיצה על B פרצוף עצוב."
    student:
      goal: "נבנה תג שמראה לכולם איך אנחנו מרגישים היום."
      concept: "**אירוע** הוא משהו שקורה – למשל לחיצה על כפתור. הקוד שבתוך [[כאשר כפתור A לחוץ]] רץ רק כשלוחצים."
      steps:
        - "מקטגוריית **קלט** גררו [[כאשר כפתור A לחוץ]]."
        - "בתוכו שימו [[הצג את הסמל]] עם פרצוף שמח 😀."
        - "גררו עוד [[כאשר כפתור A לחוץ]] ושנו את A ל-B."
        - "בתוכו שימו פרצוף עצוב 🙁."
        - "בדקו בסימולטור – לחצו A ואז B."
      tip: "כדי לנקות את המסך יש את הבלוק [[נקה מסך]] בקטגוריה בסיס ← עוד."
      challenge: "הוסיפו אירוע של לחיצה על A+B ביחד, שמציג פרצוף מופתע."
    guide:
      duration: "45 דקות"
      objectives: ["תכנות מונחה אירועים", "קלט מכפתורים"]
      materials: ["micro:bit", "סוללות", "סקוטש או חוט כדי לענוד את התג (לא חובה)"]
      flow: ["שיחה: איך מראים רגשות בלי מילים?", "בניית התג", "סבב: כל אחד מציג את הרגש שלו"]
      common_mistakes: ["שני אירועים עם אותו כפתור – רק אחד יעבוד"]
      extension: "לצייר פרצופים עם הצג נוריות לד במקום האייקונים המוכנים."
    links:
      source: "https://microbit.org/projects/make-it-code-it/emotion-badge/"
      code:
        - makecode: "https://makecode.microbit.org/#pub:_d4aPaHUrmcX4"
          hex: "https://downloads.microbit.org/downloads/emotion-badge-makecode.hex"

  - id: flashing-emotions
    title: "רגשות מהבהבים"
    source: microbit
    level: beginner
    concepts: [אירועים, לולאה]
    summary: "פרצוף שמהבהב כדי למשוך תשומת לב."
    student:
      goal: "נשדרג את תג הרגשות: הפרצוף יהבהב, כדי שכולם ישימו לב."
      steps:
        - "בתוך [[כאשר כפתור A לחוץ]] שימו [[הצג את הסמל]] עם פרצוף שמח."
        - "מתחתיו [[השהה (ms)]] של 500 ואז [[נקה מסך]] ועוד [[השהה (ms)]]."
        - "כדי שזה יקרה כמה פעמים – עטפו הכול בבלוק [[חזור 4 פעמים]] מקטגוריית לולאות."
        - "עשו אותו דבר לכפתור B עם פרצוף עצוב."
      tip: "[[חזור]] חוזר מספר פעמים שאתם בוחרים, ו-[[לעולמים]] חוזר בלי סוף."
      challenge: "גרמו לפרצוף להבהב מהר יותר ויותר."
    guide:
      duration: "45 דקות"
      objectives: ["לולאה עם מספר חזרות ([[חזור]])", "השוואה בין [[חזור]] ל-[[לעולמים]]"]
      materials: ["micro:bit"]
      common_mistakes: ["שכחת [[השהה (ms)]] אחרי [[נקה מסך]] – לא רואים הבהוב"]
      extension: "הבהוב במהירות שונה לכל רגש."
    links:
      source: "https://microbit.org/projects/make-it-code-it/flashing-emotions/"
      code:
        - makecode: "https://makecode.microbit.org/#pub:_2DRXqjK1dc3R"
          hex: "https://downloads.microbit.org/downloads/flashing-emotions-makecode.hex"

  - id: name-badge
    title: "תג שם"
    source: microbit
    level: beginner
    concepts: [טקסט, לולאה]
    summary: "השם שלכם גולל על המסך בלי הפסקה."
    student:
      goal: "נבנה תג שם שגולל את השם שלנו כל הזמן."
      steps:
        - "גררו [[הצג מחרוזת]] לתוך [[לעולמים]]."
        - "כתבו את השם שלכם באותיות באנגלית (המיקרוביט לא מכיר אותיות בעברית)."
        - "בדקו בסימולטור והעבירו ללוח."
        - "חברו סוללה וענדו את התג!"
      tip: "כדי שיהיה רווח בין פעם לפעם, הוסיפו [[השהה (ms)]] אחרי השם."
      challenge: "אחרי השם הציגו גם אייקון שמתאים לכם – תחביב, חיה אהובה..."
    guide:
      duration: "40 דקות"
      objectives: ["הצגת מחרוזת (string)", "הבנה שהלוח תומך רק בתווי ASCII"]
      materials: ["micro:bit", "סוללות"]
      common_mistakes: ["כתיבה בעברית – יופיעו סימנים מוזרים"]
      extension: "כפתור A מציג את השם, כפתור B את הגיל או את הכיתה."
    links:
      source: "https://microbit.org/projects/make-it-code-it/name-badge/"
      code:
        - makecode: "https://makecode.microbit.org/#pub:_Lme8X5Lq5RXE"
          hex: "https://downloads.microbit.org/downloads/name-badge-makecode.hex"

  - id: here-comes-the-sun
    title: "הנה באה השמש"
    source: microbit
    level: beginner
    concepts: [תצוגה, אנימציה]
    summary: "שמש שזורחת על המסך – אנימציה של כמה תמונות."
    student:
      goal: "נצייר שמש שעולה מעל האופק."
      steps:
        - "בתוך [[לעולמים]] הוסיפו כמה בלוקים [[הצג נוריות לד]]."
        - "בכל תמונה ציירו את השמש קצת יותר גבוה."
        - "בתמונה האחרונה הוסיפו קרני שמש ☀️."
      tip: "אפשר לשכפל בלוק בקליק ימני ← Duplicate, ולשנות בו רק כמה נורות."
      challenge: "הוסיפו גם שקיעה – השמש יורדת בחזרה."
    guide:
      duration: "45 דקות"
      objectives: ["תכנון אנימציה בשלבים"]
      materials: ["micro:bit"]
      extension: "כפתור A = זריחה, כפתור B = שקיעה."
    links:
      source: "https://microbit.org/projects/make-it-code-it/here-comes-the-sun/"
      code:
        - makecode: "https://makecode.microbit.org/#pub:_WAP3mJ7dpWTe"
          hex: "https://downloads.microbit.org/downloads/here-comes-the-sun-makecode.hex"

  - id: dice
    title: "קובייה"
    source: microbit
    level: beginner
    concepts: [מספר אקראי, חיישן תנועה]
    summary: "מטלטלים את הלוח ומקבלים מספר אקראי בין 1 ל-6."
    student:
      goal: "נהפוך את המיקרוביט לקובייה: מנערים אותו – ומופיע מספר."
      concept: "**מספר אקראי** הוא מספר שאי אפשר לדעת מראש מה יהיה – בדיוק כמו בהטלת קובייה. **מד התאוצה** מרגיש מתי מנערים את הלוח."
      steps:
        - "מקטגוריית **קלט** גררו [[כאשר שקשק]]."
        - "בתוכו שימו [[הצג מספר]]."
        - "מקטגוריית **מתמטיקה** גררו [[בחר מספר אקראי 0 ל 10]] לתוך העיגול של הצג מספר."
        - "שנו את הטווח ל-1 עד 6."
        - "בסימולטור לחצו על SHAKE כדי לנער."
      tip: "חשבו: למה צריך לכתוב 1 ולא 0?"
      challenge: "הכינו קובייה של משחק אחר – למשל עם 20 צדדים."
    guide:
      duration: "45 דקות"
      objectives: ["אקראיות", "קלט מחיישן תאוצה", "הכנסת בלוק לתוך בלוק"]
      materials: ["micro:bit", "סוללות", "קובייה אמיתית להשוואה"]
      flow: ["משחק קובייה קצר", "בניית הקוד", "ניסוי: 30 הטלות, כמה פעמים יצא 6?"]
      common_mistakes: ["טווח 0–6 במקום 1–6"]
