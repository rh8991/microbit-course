      makecode: "https://makecode.microbit.org/"

  - id: tb-tracking
    title: "נוסעים על קו"
    source: tinybit
    level: advanced
    concepts: [חיישני קו, תנאים מורכבים, and]
    summary: "הרובוט עוקב אחרי קו שחור בעזרת שני חיישנים."
    student:
      goal: "נלמד את הרובוט לנסוע לבד על קו שחור – כמו רכבת על מסילה 🚂."
      concept: "מתחת לרובוט יש **שני חיישני קו**: שמאלי וימני. כל אחד יודע אם הוא מעל שחור או מעל לבן. בעזרת **וגם** בודקים את שניהם ביחד."
      steps:
        - "שני החיישנים על לבן (הקו באמצע ביניהם) → [[CarCtrlSpeed Run speed 70]]."
        - "השמאלי על שחור והימני על לבן (הקו ברח שמאלה) → [[CarCtrlSpeed SpinLeft speed 70]]."
        - "השמאלי על לבן והימני על שחור → [[CarCtrlSpeed SpinRight speed 70]]."
        - "אחרת (שניהם על שחור) → [[CarCtrlSpeed Stop speed 0]]."
        - "השתמשו ב-[[Line_Sensor direct LeftState value White Line]] וב-[[וגם]] מקטגוריית לוגיקה."
      tip: "הקו צריך להיות ברוחב של בערך 2 ס״מ, ולא להיות רחב מהמרחק בין שני החיישנים."
      challenge: "הוסיפו אורות: כחול כשנוסע ישר, צהוב כשפונה."
    guide:
      duration: "90 דקות"
      objectives: ["חיישנים אינפרא-אדום", "תנאים עם and", "אלגוריתם מעקב קו"]
      materials: ["Tiny:bit + micro:bit", "מסלול קו שחור (סרט בידוד שחור על בריסטול לבן או מפת המסלול של Yahboom)"]
      prep: "להכין מסלולים מראש. ייתכן שצריך לכוון את רגישות חיישני הקו בבורג הקטן שעל הרובוט (ראו Note.txt בתיקיית המקור)."
      common_mistakes: ["פניות חדות מדי במסלול", "מהירות גבוהה מדי", "תאורה חזקה או שמש שמבלבלת את החיישנים"]
      extension: "Tracking with light מתיקיית המקור."
    images:
      - "https://raw.githubusercontent.com/YahboomTechnology/Tiny-bit/master/06.Playing%20with%20Tiny%20bit/7.Tracking/Tracking.png"
    links:
      source: "https://github.com/YahboomTechnology/Tiny-bit/tree/master/06.Playing%20with%20Tiny%20bit/7.Tracking"
      makecode: "https://makecode.microbit.org/"

  - id: tb-ir-control
    title: "שלט רחוק"
    source: tinybit
    level: advanced
    concepts: [אינפרא-אדום, תוסף, שלט]
    summary: "נוהגים ברובוט עם שלט אינפרא-אדום."
    student:
      goal: "נשלוט ברובוט עם שלט רחוק, כמו מכונית על שלט 🎮."
      concept: "השלט שולח אור **אינפרא-אדום** שהעין לא רואה (כמו השלט של הטלוויזיה). כל כפתור שולח קוד אחר."
      steps:
        - "הוסיפו את תוסף השלט לפי ההוראות בתיקיית המקור (ReadMe)."
        - "לכל כפתור בשלט: קדימה, אחורה, שמאלה, ימינה ועצור – בחרו פעולת [[CarCtrl]] מתאימה."
        - "הוסיפו כפתור לפנס וכפתור לצופר."
        - "העבירו לרובוט ונהגו!"
      tip: "צריך לכוון את השלט אל המקלט שעל הרובוט."
      challenge: "הוסיפו כפתורי מהירות: + ו- ."
    guide:
      duration: "60 דקות"
      objectives: ["קלט מאינפרא-אדום", "מיפוי כפתורים לפעולות"]
      materials: ["Tiny:bit + micro:bit", "שלט IR של Yahboom"]
      prep: "יש תיקייה נפרדת ל-V1.5 ול-V2 עם תוסף שונה – לבדוק מראש לפי הלוחות שבכיתה."
      common_mistakes: ["תוסף לא תואם לגרסת הלוח"]
    images:
      - "https://raw.githubusercontent.com/YahboomTechnology/Tiny-bit/master/07.Interacting%20with%20Tiny%20bit/1.IR%20Control/V2/IR%20Control.png"
    links:
      source: "https://github.com/YahboomTechnology/Tiny-bit/tree/master/07.Interacting%20with%20Tiny%20bit/1.IR%20Control"
      makecode: "https://makecode.microbit.org/"

  - id: tb-voice-control-light
    title: "אור שמגיב לקול"
    source: tinybit
    level: intermediate
    concepts: [חיישן קול, תנאי]
    summary: "מוחאים כף – והנורות נדלקות."
    student:
      goal: "נדליק את האורות של הרובוט במחיאת כף 👏."
      steps:
        - "בתוך [[לעולמים]]: [[אם]] [[Voice Sensor return]] [[>]] 100."
        - "אם כן → [[RGB_Car_Program show color]] בצבע שאתם אוהבים, [[show]], ו-[[השהה (ms) 1000]]."
        - "אחרת → [[RGB_Car_Program clear]] ו-[[show]]."
        - "קודם הציגו את ערך הקול עם [[הצג מספר]] כדי לבחור סף מתאים."
      tip: "לרובוט יש מיקרופון משלו, ולכן זה עובד גם עם micro:bit V1."
      challenge: "בכל מחיאה – צבע אחר (רמז: משתנה שגדל ב-1)."
    guide:
      duration: "45 דקות"
      objectives: ["חיישן קול של הרובוט", "בחירת סף"]
      materials: ["Tiny:bit + micro:bit"]
      prep: "רעש! לתאם עם הכיתה – מוחאים רק בתורות."
      extension: "Listener מהמאגר – הרובוט נוסע כשמוחאים כף."
    images:
      - "https://raw.githubusercontent.com/YahboomTechnology/Tiny-bit/master/06.Playing%20with%20Tiny%20bit/8.Voice%20control%20light/Voice%20control%20light.png"
    links:
      source: "https://github.com/YahboomTechnology/Tiny-bit/tree/master/06.Playing%20with%20Tiny%20bit/8.Voice%20control%20light"
      makecode: "https://makecode.microbit.org/"

  - id: project-final
    title: "פרויקט גמר ותערוכה"
    source: project
    level: advanced
    concepts: [תכנון, הנדסה, הצגה]
    summary: "פרויקט רובוט עצמאי והצגה להורים / למבקרים."
    student:
      goal: "זה הזמן להראות כל מה שלמדנו! בנו משימה לרובוט והציגו אותה בתערוכה."
      steps:
        - "בחרו משימה: רובוט שליח, רובוט שמשחק כדורגל, רובוט שומר, מופע ריקוד, מירוץ מכשולים..."
        - "כתבו תוכנית עבודה: אילו חיישנים? אילו פלטים? מה האלגוריתם?"
        - "בנו, בדקו ושפרו."
        - "קשטו את הרובוט והכינו שלט שמסביר את הפרויקט."
        - "הציגו בתערוכה!"
      tip: "תכננו גם מה לעשות אם משהו לא עובד בהצגה – גם מהנדסים אמיתיים מתכוננים לתקלות."
      challenge: "שלבו גם לוח micro:bit שני שמתקשר עם הרובוט ברדיו."
    guide:
      duration: "90 דקות"
      objectives: ["פרויקט מסכם", "הצגה ציבורית"]
      materials: ["Tiny:bit + micro:bit", "חומרי יצירה", "לוחות נוספים לרדיו"]
      prep: "להזמין הורים / כיתות אחרות. להכין שולחנות תצוגה וזירת נסיעה."
      flow: ["30 ד׳ השלמות אחרונות", "45 ד׳ תערוכה", "15 ד׳ סיכום שנה ותעודות"]
      extension: "לתלמידים מתקדמים: קורס Python של Tiny:bit מהמאגר."
    links:
      makecode: "https://makecode.microbit.org/"

