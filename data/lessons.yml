  - id: tb-breathing-light
    title: "אור נושם"
    source: tinybit
    level: intermediate
    concepts: [לולאת עבור, משתנה, בהירות]
    summary: "האור מתחזק ונחלש לאט – כמו נשימה."
    student:
      goal: "נגרום לאור הכחול להתחזק ולהיחלש לאט, כאילו הרובוט נושם 😮‍💨."
      concept: "לולאת **עבור** סופרת בשבילנו: 0, 1, 2... עד 255. בכל סיבוב המספר נשמר במשתנה, ואפשר להשתמש בו כ**בהירות**."
      steps:
        - "בתוך [[לעולמים]] שימו [[עבור index מ- 0 ל 255]] (שנו את שם המשתנה ל-a)."
        - "בתוכה: [[RGB_Car_Program set brightness]] a, [[show color blue]], [[show]] ו-[[השהה (ms) 10]]."
        - "הוסיפו עוד לולאת עבור (משתנה b) שבה הבהירות היא 255 פחות b – כך האור נחלש."
        - "העבירו לרובוט והסתכלו."
      tip: "255 הוא הכי בהיר, 0 הוא כבוי."
      challenge: "גרמו לפנס הגדול לנשום יחד עם הנורות (רמז: [[RGB_Car_Big2]] עם a במקום הכחול)."
    guide:
      duration: "45 דקות"
      objectives: ["לולאת עבור", "שימוש במשתנה הלולאה", "חיסור לקבלת ספירה לאחור"]
      materials: ["Tiny:bit + micro:bit"]
      common_mistakes: ["השהה גדול מדי – הנשימה נמשכת דקה"]
      extension: "לנשום בצבעים מתחלפים."
    images:
