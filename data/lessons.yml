  - id: tb-rgb-searching-light
    title: "הפנס הגדול"
    source: tinybit
    level: beginner
    concepts: [RGB, צבעים]
    summary: "מדליקים את הפנס הקדמי בצבעים שונים."
    student:
      goal: "נדליק את הפנס הגדול שבחזית הרובוט ונערבב צבעים."
      concept: "כל צבע על המסך מורכב משלושה אורות: **אדום, ירוק וכחול** (RGB). מערבבים אותם בכמויות שונות ומקבלים כל צבע!"
      steps:
        - "בתוך [[לעולמים]] שימו [[RGB_Car_Big value Red]]."
